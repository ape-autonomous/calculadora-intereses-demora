<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Calculadora de intereses de demora (Ley 3/2004)</title>
<style>body{font-family:sans-serif;max-width:640px;margin:2em auto;padding:0 1em}label{display:block;margin:.6em 0}input{padding:.3em}pre{background:#f4f4f4;padding:1em}</style></head><body>
<h1>Intereses de demora y costes de cobro</h1>
<p>Orientativa, no es asesoramiento jurídico. Ley 3/2004: interés de demora = tipo de referencia semestral + 8 puntos; compensación mínima de 40 € por factura. <b>Introduce tú el tipo de referencia vigente</b> y verifícalo en fuentes oficiales.</p>
<label>Importe (€) <input id="imp" type="number" step="0.01" value="1000"></label>
<label>Vencimiento <input id="ven" type="date" value="2026-06-30"></label>
<label>Fecha de cálculo <input id="hoy" type="date"></label>
<label>Tipo de referencia (%) <input id="tipo" type="number" step="0.01" value="2.15"></label>
<label>Puntos adicionales <input id="pts" type="number" step="0.01" value="8"></label>
<button onclick="calc()">Calcular</button>
<pre id="out"></pre>
<script>
function dias(a,b){return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000)}
function calc(){
  var d=Math.max(0,dias(new Date(ven.value),new Date(hoy.value)));
  var m=parseFloat(imp.value);
  var i=Math.round(m*((parseFloat(tipo.value)+parseFloat(pts.value))/100)*d/365*100)/100;
  var c=d>0?40:0;
  out.textContent="Días de retraso: "+d+"\nIntereses de demora: "+i.toFixed(2)+" €\nCostes de cobro: "+c.toFixed(2)+" €\nTOTAL: "+(m+i+c).toFixed(2)+" €";
}
hoy.valueAsDate=new Date();
</script></body></html>
